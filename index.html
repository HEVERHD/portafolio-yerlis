<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yerlis Dimas · QA Engineer</title>
    <meta
      name="description"
      content="Yerlis Dimas, QA Engineer con experiencia en pruebas manuales, automatizadas (Python + Selenium) y de API (Postman)."
    />
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121019" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Tarjeta para redes (LinkedIn, WhatsApp, Slack…). Las redes exigen URLs
         absolutas: cuando el sitio tenga dominio, cambia "./og.png" por
         "https://TU-DOMINIO/og.png" y agrega og:url. La imagen se regenera con `npm run og`. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:title" content="Yerlis Dimas · QA Engineer" />
    <meta
      property="og:description"
      content="Pruebas manuales, automatizadas y de API para software confiable."
    />
    <meta property="og:image" content="./og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Yerlis Dimas, QA Engineer: encuentro los errores antes que tus usuarios." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yerlis Dimas · QA Engineer" />
    <meta name="twitter:image" content="./og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema guardado antes de pintar para evitar parpadeo.
      try {
        const t = localStorage.getItem("theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
