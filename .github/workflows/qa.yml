name: QA

on:
  push:
    branches: [main]
  pull_request:

# Solo lectura: el workflow no publica ni escribe nada en el repo.
permissions:
  contents: read

jobs:
  e2e:
    name: Playwright + axe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Acciones fijadas por SHA de commit (no por etiqueta) para evitar
      # que una etiqueta movida introduzca código distinto.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: ninguna dependencia ejecuta código al instalarse.
      - run: npm ci --ignore-scripts

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
